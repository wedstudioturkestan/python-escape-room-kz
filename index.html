const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=makeInitial(), selected=null, picked=[], draft='', feedback=null, soundOn=false, audioCtx=null, toastTimer=null;
function makeInitial(){return{phase:'intro',player:'',group:'',index:0,deadline:0,startedAt:0,wrong:0,hints:0,hinted:{},roomHints:0,completedHints:[0,0,0,0,0],solved:[],finishedAt:0,clearedRoom:-1,failedRoom:-1,roomCorrect:0,attempts:[1,0,0,0,0],completed:[null,null,null,null,null],runId:'',reportStatus:'local'}}
function completedCount(){return state.completed.filter(v=>typeof v==='number').length}
function savedCorrect(){return state.completed.reduce((n,v)=>n+(typeof v==='number'?v:0),0)}
function totalScore(includeCurrent=false){const earnedHints=state.completedHints.reduce((s,n)=>s+n,0)+(includeCurrent&&state.phase==='play'?state.roomHints:0);return Math.max(0,(savedCorrect()+(includeCurrent&&state.phase==='play'?state.roomCorrect:0))*10-earnedHints*3)}
function runRecord(){const elapsed=Math.min(TOTAL_SECONDS,Math.max(0,Math.round(((state.finishedAt||Date.now())-state.startedAt)/1000)));return {id:state.runId,name:state.player,group:state.group,score:totalScore(),correct:savedCorrect(),wrong:state.wrong,rooms:completedCount(),attempts:state.attempts.slice(),hints:state.hints,elapsed,finished:state.phase==='win'?'Аяқтады':'Уақыт бітті',date:new Date(state.finishedAt||Date.now()).toISOString()}}
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return []}}
function saveHistory(){try{const history=getHistory().filter(x=>x.id!==state.runId);history.push(runRecord());localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-500)))}catch(e){}}
function csvCell(v){let str=String(v??'');if(/^\s*[=+\-@]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"'}
function exportCsv(){const rows=getHistory();if(!rows.length){showToast('Бұл құрылғыда нәтиже табылмады');return}const headers=['Күні','Аты-жөні','Тобы','Ұпай','Дұрыс жауап','Қате жауап','Өткен кезең','Кезең әрекеттері','Көмек саны','Уақыт (сек.)','Мәртебе','Жазба ID'];const data=rows.map(r=>[r.date,r.name,r.group,r.score,r.correct,r.wrong,r.rooms,(r.attempts||[]).join('/'),r.hints,r.elapsed,r.finished,r.id]);const csv='\uFEFF'+[headers,...data].map(r=>r.map(csvCell).join(';')).join('\r\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='Python_Escape_Room_Natizheler.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function sendReport(){if(!RESULTS_URL||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(RESULTS_URL)){state.reportStatus='local';save();return}if(state.reportStatus==='attempted')return;state.reportStatus='sending';save();render();try{await fetch(RESULTS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(runRecord())});state.reportStatus='attempted'}catch(e){state.reportStatus='error'}save();if(state.phase==='win'||state.phase==='timeout')render()}
function finish(win){if(state.phase==='win'||state.phase==='timeout')return;state.phase=win?'win':'timeout';state.finishedAt=Date.now();saveHistory();save();render();sendReport()}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function restore(){try{const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(old&&typeof old==='object'&&['intro','play','clear','retry','win','timeout'].includes(old.phase)&&Number.isInteger(old.index)&&old.index>=0&&old.index<=questions.length){state={...makeInitial(),...old};if(['play','clear','retry'].includes(state.phase)&&state.deadline<=Date.now()){state.phase=completedCount()===5?'win':'timeout';state.finishedAt=Date.now();saveHistory();save()}}}catch(e){}}
function getRoom(){return Math.min(4,Math.floor(state.index/3))}
function getCurrent(){return questions[Math.min(state.index,questions.length-1)]}
function timeLeft(){return Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function prettyTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function showToast(t){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2200)}
function beep(f=620,d=.08){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(.035,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+d)}catch(e){}}
function setTheme(){const r=state.phase==='retry'?state.failedRoom:state.phase==='clear'?state.clearedRoom:getRoom();document.documentElement.style.setProperty('--a',rooms[Math.max(0,Math.min(4,r))].accent)}
function scene(room,mini=false,open=false){return `<div class="${mini?'mini-scene':'intro-art'}"><div class="scene-scan"></div><div class="scene-orbit"></div>${mini?`<span class="scene-number">CHAMBER 0${room+1}</span>`:`<div class="room-top"><span>SECURITY CHAMBER 0${room+1}</span><span class="red">● ACCESS DENIED</span></div>`}<div class="portal ${open?'open':''}"><div class="lock-mark">${open?'✓':'♙'}</div></div><div class="platform"></div>${mini?'':`<div class="scene-bottom"><span>5 КЕЗЕҢ · 15 МИССИЯ</span><div class="room-pills">${rooms.map((r,i)=>`<span class="room-pill ${i===room?'active':''}"></span>`).join('')}</div></div>`}</div>`}
function intro(){return `<section class="section intro-grid"><div class="intro"><div class="eyebrow"><span class="bar"></span>ОҚУ ОЙЫНЫ · PYTHON 3</div><h1>PYTHON<br><span class="glow">ESCAPE ROOM</span></h1><div class="pill" style="display:inline-block;color:var(--red);border-color:#a14d65">● CODE RED: ЖҮЙЕ БҰҒАТТАЛДЫ</div><p class="desc">Виртуалды зертханада 5 есік жабылып қалды. Әр бөлмедегі 3 тапсырманың <b>кемінде 2-еуіне</b> дұрыс жауап беріңіз. Қате жауаптан кейін де келесі сұраққа өтесіз; өте алмасаңыз, тек сол бөлмені қайта бастайсыз.</p><div class="facts"><div class="fact">◷ <strong>10 минут</strong></div><div class="fact">▦ <strong>5 бөлме</strong></div><div class="fact">⌘ <strong>15 тапсырма</strong></div><div class="fact">✓ <strong>2/3 — өту шарты</strong></div></div><div class="start-panel"><form id="startForm"><div class="start-fields"><div><label class="input-label" for="playerName">СТУДЕНТТІҢ АТЫ-ЖӨНІ</label><input required autocomplete="name" maxlength="55" id="playerName" class="name-input" placeholder="Мысалы: Айбек Жанатұлы" value="${esc(state.player)}" /></div><div><label class="input-label" for="playerGroup">ТОБЫ (ҚАЛАСАҢЫЗ)</label><input autocomplete="off" maxlength="28" id="playerGroup" class="name-input" placeholder="Мысалы: ИС-23" value="${esc(state.group)}" /></div></div><button type="submit" class="btn btn-primary btn-start">МИССИЯНЫ БАСТАУ <span>➜</span></button></form><div class="start-note">Нәтиже осы құрылғыда сақталады және CSV болып жүктеледі. Google Sheets-ке автоматты жіберу үшін оқытушы байланыс сілтемесін алдын ала баптайды.</div><div class="teacher-actions"><button type="button" class="btn btn-ghost" id="localScoresBtn">☷ Нәтижелер кестесі</button><button type="button" class="btn btn-ghost" id="exportHistoryBtn">↓ CSV жүктеу</button></div></div></div>${scene(0,false,false)}</section>`}
function roomSidebar(room){return `<aside class="glass room-panel"><div class="room-heading"><div><div class="eyebrow">БӨЛМЕ 0${room+1} / 05</div><h2>${esc(rooms[room].name)}</h2><p>${esc(rooms[room].desc)}</p></div><span class="level-tag">LEVEL ${room+1}</span></div>${scene(room,true)}<div class="room-list">${rooms.map((r,i)=>`<div class="room-row ${i<room?'done':i===room?'current':''}"><div class="room-num">${i<room?'✓':i+1}</div><span>${esc(r.short)}</span><span class="room-state">${i<room?'АШЫҚ':i===room?'◉':'⌁'}</span></div>`).join('')}</div></aside>`}
function codeWidget(q){return `<div class="code-title"><span>PYTHON 3 · МИССИЯ КОДЫ</span><span>read-only</span></div><pre class="code-block"><code>${esc(q.code)}</code></pre>`}
function answerArea(q){if(q.type==='choice')return `<div class="choice-list">${q.options.map((o,i)=>`<button type="button" class="choice ${selected===i?'selected':''}" data-choice="${i}" aria-pressed="${selected===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
 if(q.type==='fill')return `<div class="text-answer"><input type="text" autocomplete="off" spellcheck="false" id="typedAnswer" aria-label="Қысқа жауап" maxlength="80" placeholder="${esc(q.placeholder||'Жауап енгізіңіз')}" value="${esc(draft)}"></div>`;
 const remaining=q.pieces.filter(p=>!picked.includes(p.id));return `<div class="sort-title">СІЗДІҢ КОДЫҢЫЗ · Таңдалған жолды бассаңыз, алып тасталады</div><div class="sort-zone">${picked.length?picked.map(id=>{const p=q.pieces.find(x=>x.id===id);return `<button type="button" class="sort-item" data-remove="${esc(id)}" title="Қатардан алып тастау">${esc(p.text)}</button>`}).join(''):'<div class="empty">Код жолдарын төменнен ретімен таңдаңыз</div>'}</div><div class="sort-title">ҚОЛЖЕТІМДІ ЖОЛДАР</div><div class="sort-choices">${remaining.map(p=>`<button type="button" class="sort-choice" data-add="${esc(p.id)}">＋ ${esc(p.text)}</button>`).join('')}</div>`}
function stats(){const n=Math.min(state.index,15), current=getRoom();return `<div class="game-stats"><div class="glass stat-progress"><div class="progress-head"><span class="stat-label">МИССИЯ ОРЫНДАЛУЫ · ${completedCount()}/5 бөлме</span><strong>БӨЛМЕ ${current+1}: ${Math.min(3,n%3+1)}/3 · Өту үшін 2 дұрыс</strong></div><div class="track"><div style="width:${completedCount()/5*100}%"></div></div></div><div class="glass stat-card"><div class="stat-label">ТАЙМЕР</div><div class="stat-num timer" data-timer>${prettyTime(timeLeft())}</div></div><div class="glass stat-card"><div class="stat-label">ҰПАЙ</div><div class="stat-num" style="color:var(--green)" id="scoreNum">${totalScore(true)}</div></div><div class="glass stat-card"><div class="stat-label">ДҰРЫС / 3</div><div class="stat-num">${state.roomCorrect}</div></div></div>`}
function feedbackHtml(q){if(!feedback)return '';return `<div class="feedback ${feedback.ok?'ok':''}" role="status"><span style="font-size:22px">${feedback.ok?'✓':'✕'}</span><div><strong>${feedback.ok?'Дұрыс жауап! +10 ұпай':'Қате жауап. Келесі сұраққа өтесіз.'}</strong><p>${feedback.ok?esc(q.explanation):'Дұрыс жауап: <b>'+esc(q.correct)+'</b>. '+esc(q.explanation)}</p><span style="font-size:11px;color:var(--muted)">2 секундтан соң автоматты түрде жалғасады. Төмендегі батырманы да басуға болады.</span></div></div>`}
function playing(){let room=getRoom(),q=getCurrent();return `<section class="section">${stats()}<div class="game-layout">${roomSidebar(room)}<article class="glass q-panel"><div class="q-top"><span class="q-id">БӨЛМЕ ${room+1} · СҰРАҚ ${state.index%3+1} / 3 · ӘРЕКЕТ ${state.attempts[room]||1}</span><span class="q-kind">${kindLabels[q.type]}</span></div><h2>${esc(q.title)}</h2><p class="q-prompt">${esc(q.prompt)}</p>${codeWidget(q)}${feedback?'':answerArea(q)}${state.hinted[state.index]?`<div class="hint-box"><b>✦ Көмекшінің кеңесі:</b> ${esc(q.hint)}</div>`:''}${feedbackHtml(q)}<div class="answer-actions">${feedback?`<button class="btn btn-primary" id="nextBtn">${(state.index+1)%3===0?'КЕЗЕҢ НӘТИЖЕСІ':'КЕЛЕСІ СҰРАҚ'} ➜</button>`:`<button class="btn btn-primary" id="checkBtn">ЖАУАПТЫ БЕКІТУ ↗</button>`}${feedback?'':`<button class="btn hint-btn ${state.hinted[state.index]?'used':''}" id="hintBtn" ${state.hinted[state.index]?'disabled':''}>✦ ${state.hinted[state.index]?'Кеңес ашылды':'КЕҢЕС · −3'}</button>`}</div><p class="q-note">Әр сұраққа 1 жауап · Дұрыс +10 · Қате 0 · Кеңес −3 · Өтпеген кезеңдегі ұпай есептелмейді</p></article></div></section>`}
function roomclear(){let n=state.clearedRoom,r=rooms[n],isLast=n===4;return `<section class="section"><div class="glass roomclear"><div class="emblem">✓</div><div class="eyebrow">ACCESS GRANTED · 0${n+1}/05</div><h1>${esc(r.name)}<br><span style="color:var(--green)">АШЫЛДЫ!</span></h1><p><b>${state.completed[n]} / 3</b> дұрыс жауап. Кезең ${state.attempts[n]} әрекетте аяқталды.</p><div class="summary-grid"><div class="summary"><strong>${completedCount()}/5</strong><span>АШЫЛҒАН БӨЛМЕ</span></div><div class="summary"><strong>${totalScore()}</strong><span>ЖАЛПЫ ҰПАЙ</span></div><div class="summary"><strong data-timer>${prettyTime(timeLeft())}</strong><span>ҚАЛҒАН УАҚЫТ</span></div></div><div class="lesson-box"><b>★ НЕ ҮЙРЕНДІК?</b><p>${esc(r.lesson)}</p></div><button id="continueBtn" class="btn btn-primary">${isLast?'НӘТИЖЕНІ КӨРУ':'КЕЛЕСІ БӨЛМЕГЕ ӨТУ ➜'}</button></div></section>`}
function retryScreen(){const room=state.failedRoom;return `<section class="section"><div class="glass roomclear retry-screen"><div class="emblem retry-icon">!</div><div class="eyebrow">ACCESS DENIED · БӨЛМЕ ${room+1}/5</div><h1>КЕЗЕҢ ӘЗІРГЕ<br><span style="color:var(--red)">АШЫЛМАДЫ</span></h1><p>Сіз 3 сұрақтың <b>${state.roomCorrect}</b>-еуіне дұрыс жауап бердіңіз. Өту үшін кемінде <b>2 дұрыс жауап</b> қажет.</p><div class="summary-grid"><div class="summary"><strong>${state.roomCorrect}/3</strong><span>ДҰРЫС ЖАУАП</span></div><div class="summary"><strong>${state.attempts[room]}</strong><span>ӘРЕКЕТ</span></div><div class="summary"><strong data-timer>${prettyTime(timeLeft())}</strong><span>ҚАЛҒАН УАҚЫТ</span></div></div><p>Бұрынғы кезеңдер сақталады. Тек осы бөлменің 3 сұрағын қайта бастайсыз. Таймер тоқтамайды.</p><button class="btn btn-primary" id="retryBtn">↻ ОСЫ КЕЗЕҢДІ ҚАЙТАЛАУ</button></div></section>`}
function result(win){const r=runRecord();const title=win?'ЗЕРТХАНАДАН ШЫҚТЫҢЫЗ!':'УАҚЫТ АЯҚТАЛДЫ';const msg=win?'Барлық бес құлып ашылды. Нәтиже сақталды.':'10 минут аяқталды. Аяқталған кезеңдердің нәтижесі сақталды.';const delivery=!RESULTS_URL?'Google Sheets байланысы әзірге қосылмаған. CSV жүктеп, оқытушыға беріңіз.':state.reportStatus==='attempted'?'Онлайн жіберу әрекеті орындалды. Жазба келгенін Google кестесінен тексеріңіз.':state.reportStatus==='error'?'Google Sheets-ке жіберу сәтсіз болды. CSV файлын пайдаланыңыз.':'Онлайн жіберу орындалуда…';return `<section class="section"><div class="glass end"><div class="emblem" style="${win?'':'border-color:#bb5c75;background:#4a213b;color:#ffa0b6'}">${win?'★':'⌛'}</div><div class="eyebrow">${win?'MISSION COMPLETE':'MISSION TIMEOUT'}</div><h1>${title}</h1><div class="status-line"><span class="pill">${esc(state.player)}</span>${state.group?`<span class="pill">${esc(state.group)}</span>`:''}<span class="pill">${win?'MISSION COMPLETE':'TIMEOUT'}</span></div><p>${msg}</p><div class="summary-grid"><div class="summary"><strong>${r.score}/150</strong><span>ҰПАЙ</span></div><div class="summary"><strong>${r.rooms}/5</strong><span>АЯҚТАЛҒАН КЕЗЕҢ</span></div><div class="summary"><strong>${prettyTime(r.elapsed)}</strong><span>ЖҰМСАЛҒАН УАҚЫТ</span></div></div><p class="report-note">${delivery}</p><div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" id="exportResultBtn">↓ НӘТИЖЕНІ CSV ЖҮКТЕУ</button>${RESULTS_URL&&state.reportStatus==='error'?'<button class="btn btn-muted" id="resendBtn">↻ ҚАЙТА ЖІБЕРУ</button>':''}<button class="btn btn-muted" id="restartBtn">↻ ЖАҢА ОЙЫН</button><button class="btn btn-ghost" id="reviewBtn">☷ ЖАУАПТАРДЫ ТАЛДАУ</button></div></div><div id="reviewTarget"></div></section>`}
function reviewHtml(){return `<div class="glass review"><h2>ОҚЫТУШЫМЕН БІРГЕ ТАЛДАУ · 15 СҰРАҚ</h2>${questions.map((q,i)=>`<div class="review-item"><b>${i+1}. ${esc(q.title)} — <span style="color:var(--green)">${esc(q.correct)}</span></b><p>${esc(q.explanation)}</p></div>`).join('')}</div>`}
function render(){setTheme();const root=$('#app');if(state.phase==='intro')root.innerHTML=intro();else if(state.phase==='play')root.innerHTML=playing();else if(state.phase==='clear')root.innerHTML=roomclear();else if(state.phase==='retry')root.innerHTML=retryScreen();else root.innerHTML=result(state.phase==='win');bind();updateClock()}
function bind(){
 if(state.phase==='intro'){
  $('#startForm').addEventListener('submit',e=>{e.preventDefault();let name=$('#playerName').value.trim().replace(/\s+/g,' ');let group=$('#playerGroup').value.trim().replace(/\s+/g,' ');if(name.length<2){showToast('Аты-жөніңізді дұрыс енгізіңіз');return}state=makeInitial();state.player=name.slice(0,55);state.group=group.slice(0,28);state.startedAt=Date.now();state.deadline=state.startedAt+TOTAL_SECONDS*1000;state.runId='run_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,11);state.phase='play';clearAnswer();save();beep(690,.11);render()});$('#exportHistoryBtn').addEventListener('click',exportCsv);$('#localScoresBtn').addEventListener('click',showHistory);
 }
 if(state.phase==='play'){
  const q=getCurrent();document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{if(feedback)return;selected=Number(el.dataset.choice);render()}));document.querySelectorAll('[data-add]').forEach(el=>el.addEventListener('click',()=>{if(feedback)return;picked.push(el.dataset.add);render()}));document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{if(feedback)return;picked=picked.filter(id=>id!==el.dataset.remove);render()}));if(q.type==='fill'&&!feedback){const el=$('#typedAnswer');el.addEventListener('input',()=>draft=el.value);el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkAnswer()}})}
  const check=$('#checkBtn');if(check)check.addEventListener('click',checkAnswer);const next=$('#nextBtn');if(next)next.addEventListener('click',nextQuestion);const hint=$('#hintBtn');if(hint)hint.addEventListener('click',showHint);
 }
 if(state.phase==='retry'){$('#retryBtn').addEventListener('click',()=>{const room=state.failedRoom;state.index=room*3;state.roomCorrect=0;state.roomHints=0;state.attempts[room]++;state.phase='play';for(let i=room*3;i<room*3+3;i++)delete state.hinted[i];clearAnswer();save();render()})}
 if(state.phase==='clear'){$('#continueBtn').addEventListener('click',()=>{if(state.clearedRoom===4){finish(true)}else{state.index=(state.clearedRoom+1)*3;state.attempts[state.clearedRoom+1]=1;state.roomCorrect=0;state.roomHints=0;state.phase='play';clearAnswer();save();beep(710,.12);render()}})}
 if(state.phase==='win'||state.phase==='timeout'){
  $('#exportResultBtn').addEventListener('click',exportCsv);const resend=$('#resendBtn');if(resend)resend.addEventListener('click',sendReport);
  $('#restartBtn').addEventListener('click',()=>{if(!confirm('Жаңа ойын бастайсыз ба? Бұрынғы нәтиже осы браузер тарихында қалады.'))return;state=makeInitial();clearAnswer();save();render()});
  $('#reviewBtn').addEventListener('click',()=>{const tgt=$('#reviewTarget');if(tgt.innerHTML){tgt.innerHTML='';$('#reviewBtn').textContent='☷ ЖАУАПТАРДЫ ТАЛДАУ'}else{tgt.innerHTML=reviewHtml();$('#reviewBtn').textContent='× ТАЛДАУДЫ ЖАБУ';tgt.scrollIntoView({behavior:'smooth',block:'start'})}})
 }
}
function clearAnswer(){selected=null;picked=[];draft='';feedback=null}
function showHint(){if(state.phase!=='play'||feedback||state.hinted[state.index])return;state.hinted[state.index]=true;state.hints++;state.roomHints++;if($('#typedAnswer'))draft=$('#typedAnswer').value;save();beep(410,.06);render()}
let autoNextTimer=null;
function checkAnswer(){if(state.phase!=='play'||feedback)return;let q=getCurrent(),answer=null,correct=false;if(q.type==='choice'){answer=selected;if(answer===null){showToast('Алдымен жауап нұсқасын таңдаңыз');return}correct=answer===q.answer}else if(q.type==='fill'){answer=($('#typedAnswer')?.value??draft).trim();draft=answer;if(!answer){showToast('Жауапты енгізіңіз');return}correct=answer===q.answer}else{answer=picked.slice();if(answer.length!==q.answer.length){showToast('Барлық код жолдарын ретімен таңдаңыз');return}correct=answer.every((id,i)=>id===q.answer[i])}
 if(correct){state.roomCorrect++;beep(740,.09)}else{state.wrong++;beep(260,.17)}state.solved.push({q:state.index,attempt:state.attempts[getRoom()],correct});feedback={ok:correct};save();render();const at=state.index;clearTimeout(autoNextTimer);autoNextTimer=setTimeout(()=>{if(state.phase==='play'&&state.index===at&&feedback)nextQuestion()},2300)
}
function nextQuestion(){if(!feedback||state.phase!=='play')return;clearTimeout(autoNextTimer);const room=getRoom();state.index++;clearAnswer();if(state.index%3===0){if(state.roomCorrect>=PASS_MIN){state.completed[room]=state.roomCorrect;state.completedHints[room]=state.roomHints;state.clearedRoom=room;state.phase='clear';beep(870,.16)}else{state.failedRoom=room;state.phase='retry'}}save();render();window.scrollTo({top:0,behavior:'smooth'})}
function updateClock(){if(!['play','clear','retry'].includes(state.phase))return;const left=timeLeft();document.querySelectorAll('[data-timer]').forEach(el=>{el.textContent=prettyTime(left);el.classList.toggle('warning',left<=60)});if(left===0){clearTimeout(autoNextTimer);finish(completedCount()===5)}}
function showHistory(){const root=$('#modalRoot'),rows=getHistory().slice().reverse();root.innerHTML=`<div class="modal-back" id="historyBack"><div class="modal score-modal" role="dialog" aria-modal="true"><button class="icon-btn modal-close" id="historyClose" aria-label="Жабу">×</button><div class="eyebrow">ОҚЫТУШЫ ПАНЕЛІ · ЖЕРГІЛІКТІ</div><h2>Осы құрылғыдағы нәтижелер</h2><p>Бұл кесте тек осы браузерде ойнаған студенттердің нәтижелерін көрсетеді. Басқа телефондардан нәтижелер Google Sheets арқылы ғана біріктіріледі.</p>${rows.length?`<div class="table-scroller"><table class="score-table"><thead><tr><th>Аты-жөні</th><th>Тобы</th><th>Ұпай</th><th>Кезең</th><th>Уақыты</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.group)}</td><td>${esc(r.score)}</td><td>${esc(r.rooms)}/5</td><td>${esc(prettyTime(r.elapsed))}</td></tr>`).join('')}</tbody></table></div>`:'<p>Әзірге нәтиже жоқ.</p>'}<div class="teacher-actions"><button class="btn btn-primary" id="historyExport">↓ CSV жүктеу</button><button class="btn btn-ghost" id="historyOkay">ЖАБУ</button></div></div></div>`;const close=()=>root.innerHTML='';$('#historyClose').onclick=close;$('#historyOkay').onclick=close;$('#historyBack').onclick=e=>{if(e.target.id==='historyBack')close()};$('#historyExport').onclick=exportCsv}
function showHelp(){const root=$('#modalRoot');root.innerHTML=`<div class="modal-back" id="modalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><button class="icon-btn modal-close" id="modalClose" aria-label="Жабу">×</button><div class="eyebrow">MISSION RULES</div><h2 id="rulesTitle">Ойын ережелері</h2><p>Python бойынша бес бөлмеде барлығы 15 сұрақ бар. Әр бөлмеден өту үшін 3 сұрақтың кемінде 2-еуіне дұрыс жауап беріңіз.</p><ul><li><b>Уақыт:</b> 10 минут, қайта әрекет кезінде де таймер тоқтамайды.</li><li><b>Әр сұрақ:</b> бір жауап бересіз; қате жауаптан кейін келесі сұрақ ашылады.</li><li><b>Кезең нәтижесі:</b> 2/3 немесе 3/3 болса өтесіз; 0/3 немесе 1/3 болса тек осы кезеңді қайта бастайсыз.</li><li><b>Ұпай:</b> дұрыс жауап +10, қате жауап +0. Өтпеген кезеңдегі ұпай мен кеңес айыппұлы есептелмейді.</li><li><b>Көмекшінің кеңесі:</b> әр сұрақта бір рет беріледі, −3 ұпай тек сәтті өткен кезеңнің соңғы әрекетіне есептеледі.</li><li><b>Нәтижелер:</b> ойын аяқталғанда аты-жөніңіз, тобыңыз және қорытындыңыз браузерде сақталып, мұғалімнің Google кестесіне жіберіледі. CSV ретінде де жүктей аласыз.</li></ul><button class="btn btn-primary" id="modalOkay">ТҮСІНІКТІ</button></div></div>`;const close=()=>root.innerHTML='';$('#modalClose').onclick=close;$('#modalOkay').onclick=close;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')close()}}
$('#helpBtn').addEventListener('click',showHelp);$('#fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){showToast('Бұл браузер толық экран режимін қолдамауы мүмкін')}});$('#soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'♫':'♪̸';$('#soundBtn').setAttribute('aria-label',soundOn?'Дыбысты өшіру':'Дыбысты қосу');if(soundOn)beep(650,.11)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').innerHTML)$('#modalRoot').innerHTML=''});
restore();render();setInterval(updateClock,350);
</script>
